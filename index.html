<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <title>9oose.net</title>
    <style>
    /* --------------------------------------
       1. MOBILE FIRST (Default Screen Styles)
       -------------------------------------- */
    body {
        margin: 0;
        padding: 20px;
        background: #f9f9f9;
    }

    .document-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin-bottom: 40px;

        background: white;
        border: 3px solid #000;
        box-shadow: 10px 10px 0px #000;
        padding: 10px;
    }

    .svg-column {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
        object-fit: contain;
    }

    /* --------------------------------------
       2. DESKTOP SCREENS
       -------------------------------------- */
    @media screen and (min-width: 768px) {
        .document-container {
            grid-template-columns: repeat(3, 1fr);
            max-width: 1440px;
            margin: 20px auto 20px auto;
        }
    }

    /* --------------------------------------
       3. PERFECT PRINT SETTINGS
       -------------------------------------- */
    @media print {
        @page {
            size: landscape;
            margin: 0 0 0 0.5in;
        }

        body {
            background: white;
            padding: 0;
        }

        .document-container {
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            background: transparent !important;

            display: flex !important;
            flex-direction: row !important;
            flex-wrap: wrap !important;
        }

        .svg-column {
            width: 32% !important;
            margin-right: 2% !important; /* The missing gap! */
            margin-bottom: 0 !important;
            break-inside: avoid;
        }

        .svg-column:nth-child(3n) {
            margin-right: 0 !important;
            break-after: page;
            page-break-after: always;
        }
    }
    </style>
  </head>
  <body>
    <main>
      <div class="document-container">
        <object class="svg-column" type="image/svg+xml" data="new-standard-homepage-1.svg"></object>
        <object class="svg-column" type="image/svg+xml" data="new-standard-homepage-2.svg"></object>
        <object class="svg-column" type="image/svg+xml" data="new-standard-homepage-3.svg"></object>
      </div>
    </main>

    <script>
      window.addEventListener('load', () => {
          const columns = document.querySelectorAll('object.svg-column');

          columns.forEach(col => {
              col.addEventListener('load', () => {
                  try {
                      const links = col.contentDocument.querySelectorAll('a');
                      links.forEach(link => {
                          link.setAttribute('target', '_top');
                          link.setAttribute('rel', 'noopener noreferrer');
                      });
                  } catch(e) {
                      console.log("Local CORS block - JS will work normally on live server.");
                  }
              });
          });
      });
    </script>
  </body>
</html>
