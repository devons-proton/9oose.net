<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <title>9oose.net</title>
    <style>
    /* --------------------------------------
       1. MOBILE FIRST (Default Screen Styles)
       -------------------------------------- */
    body {
        margin: 0;
        padding: 20px;
        background: #f9f9f9; /* Just to help you see the page boundaries */
    }

    .document-container {
        display: grid;
        grid-template-columns: 1fr; /* Stack vertically on phones */
        gap: 20px;
        margin-bottom: 40px;

        background: white;
        border: 3px solid #000;
        box-shadow: 10px 10px 0px #000;
        padding: 10px;
    }

    .svg-column {
        /* 1. Override Typst's hardcoded SVG attributes GLOBALLY */
        width: 100% !important;
        height: auto !important;

        /* 2. Prevent the SVG from ever overflowing its container */
        max-width: 100%;

        /* 3. Ensure the browser scales it cleanly rather than stretching it */
        object-fit: contain;
    }

    /* --------------------------------------
       2. DESKTOP SCREENS
       -------------------------------------- */
    @media screen and (min-width: 768px) {
        .document-container {
        /* Automatically arrange into 3 equal columns! */
        grid-template-columns: repeat(3, 1fr);
        max-width: 1440px;
        margin: 20px auto 20px auto;
        }
    }

    /* --------------------------------------
       3. PERFECT PRINT SETTINGS
       -------------------------------------- */
    @media print {
        @page {
            size: landscape; /* Fits three columns beautifully */
            margin: 0 0 0 0.5in; /* Killspace */
        }

        body {
            background: white;
            padding: 0;
        }

        .document-container {
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            background: transparent !important;

            /* Switch to Flexbox for highly stable printer page breaks */
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: wrap !important; /* Allows items to wrap to a new row */
        }

        .svg-column {
            width: 32% !important;
            break-inside: avoid;
        }
        .svg-column:nth-child(3n) {
            margin-right: 0 !important; /* Remove right gap on the last column */

            /* Force the printer to start a new physical page immediately after! */
            break-after: page;
            page-break-after: always;
        }
    }
    </style>
  </head>
  <body>
    <main>
      <div class="document-container">
        <img class="svg-column" src="new-standard-homepage-1.svg" alt="Column 1" />
        <img class="svg-column" src="new-standard-homepage-2.svg" alt="Column 2" />
        <img class="svg-column" src="new-standard-homepage-3.svg" alt="Column 3" />
      </div>

      </main>
  </body>
</html>
