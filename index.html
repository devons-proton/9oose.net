<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <title>9oose.net</title>
    <style>
    /* --------------------------------------
       1. MOBILE FIRST (Default Screen Styles)
       -------------------------------------- */
    body {
        margin: 0;
        padding: 20px;
        background: #f9f9f9;
    }

    .document-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin-bottom: 40px;

        background: white;
        border: 3px solid black;
        box-shadow: 10px 10px 0px black;
        padding: 10px;
    }

    /* THE FIX: We target the <div> AND the injected <svg>! */
    .svg-column,
    .svg-column svg {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
        display: block; /* Removes weird spacing below images */
    }

    /* --------------------------------------
       2. DESKTOP SCREENS
       -------------------------------------- */
    @media screen and (min-width: 768px) {
        .document-container {
            grid-template-columns: repeat(3, 1fr);
            max-width: 1440px;
            margin: 20px auto 20px auto;
        }
    }

    /* --------------------------------------
       3. PERFECT PRINT SETTINGS
       -------------------------------------- */
    @media print {
        @page {
            size: landscape;
            margin: 0 0 0 0.5in;
        }

        body {
            background: white;
            padding: 0;
        }

        .document-container {
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            background: transparent !important;

            display: flex !important;
            flex-direction: row !important;
            flex-wrap: wrap !important;
        }

        .svg-column {
            width: 32% !important;
            margin-right: 2% !important;
            margin-bottom: 0 !important;
            break-inside: avoid;
        }

        .svg-column:nth-child(3n) {
            margin-right: 0 !important;
            break-after: page;
            page-break-after: always;
        }
    }
    </style>
  </head>
  <body>
    <main>
      <div class="document-container">
        <div class="svg-column" data-src="new-standard-homepage-1.svg"></div>
        <div class="svg-column" data-src="new-standard-homepage-2.svg"></div>
        <div class="svg-column" data-src="new-standard-homepage-3.svg"></div>
      </div>
    </main>

    <script>
      // The new Inline Injection Script
      window.addEventListener('load', () => {
          const columns = document.querySelectorAll('.svg-column');

          columns.forEach(async (col) => {
              try {
                  // 1. Fetch the raw SVG file from your server
                  const source = col.getAttribute('data-src');
                  const response = await fetch(source);

                  if (!response.ok) throw new Error("Could not fetch SVG");

                  // 2. Read it as text and inject it directly into the webpage
                  const svgText = await response.text();
                  col.innerHTML = svgText;

                  // 3. Now that it is natively on the page, easily fix the links!
                  const links = col.querySelectorAll('a');
                  links.forEach(link => {
                      link.setAttribute('target', '_top'); // Break out!
                      link.setAttribute('rel', 'noopener noreferrer'); // Security lock
                  });

              } catch (e) {
                  console.error(`Failed to inject ${col.getAttribute('data-src')}:`, e);
              }
          });
      });
    </script>
  </body>
</html>
